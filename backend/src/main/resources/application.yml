server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: azimov-lms
  
  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/azimov_lms
    username: azimov
    password: azimov_secret
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
  
  # MinIO (S3)
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: azimov-lms

# JWT Configuration
jwt:
  secret: azimov-lms-super-secret-key-for-jwt-tokens-must-be-at-least-256-bits-long-for-hs256
  access-token-expiration: 900000      # 15 минут в миллисекундах
  refresh-token-expiration: 604800000  # 7 дней в миллисекундах

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Logging
logging:
  level:
    com.azimov.lms: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
